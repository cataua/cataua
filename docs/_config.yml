# Jekyll Configuration for GitHub Pages
title: Rogério Caetano
description: Software Engineer/Software Architect - Design | Software Engineering | IoT | Retrocomputing
author: Rogério Caetano
url: https://rogerio.caetano.jdf.br
repository: cataua/cataua.github.io

# Theme
theme: jekyll-theme-minimal

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Collections
language_default: en

posts_dir: _posts
collections:
  en:
    output: true
    permalink: /en/:collection/:slug
  pt:
    output: true
    permalink: /pt/:collection/:slug

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "en"
    values:
      layout: "page"
  - scope:
      path: "_en/posts"
      type: "posts"
    values:
      layout: "post"
      permalink: /en/posts/:slug
  - scope:
      path: ""
      type: "pt"
    values:
      layout: "page"
  - scope:
      path: "_pt/posts"
      type: "posts"
    values:
      layout: "post"
      permalink: /pt/posts/:slug

# Sass configuration
sass:
  style: expanded
  sass_dir: _sass

# Exclude these files from the build
exclude:
  - README.md
  - README-pt.md
  - CNAME
